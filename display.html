<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
     <div class="sponsors"> 
        <img class="company" id="kpunkts" src="spons/kpunkts.png">
       <img class="company" id="ezis"  src="spons/ezis.png">
       <img class="company" id="bauskas" src="spons/bauskas.png">
       <img class="company" id="antali" src="spons/antali.png">
       <img class="company" id="jolly" src="spons/jolly.png">
    </div>
<div class="tables-wrapper">
    <section class="table-panel">
        <h2 class="table-title">100km Dalībnieki</h2>
        <div class="table-scroll" data-table="100km">
            <table id="participants-table-100km" class="results-table">
                <thead>
                    <tr>
                        <th class="row-index">Nr.p.k.</th>
                        <th id="name-header-100km"><span class="header-container">Vārds <svg class="arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 16l-6-6h12z" fill="currentColor"/></svg></span></th>
                        <th id="surname-header-100km"><span class="header-container">Uzvārds <svg class="arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 16l-6-6h12z" fill="currentColor"/></svg></span></th>
                        <th id="starts-header-100km"><span class="header-container">Starts <svg class="arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 16l-6-6h12z" fill="currentColor"/></svg></span></th>
                        <th id="kp1-header-100km"><span class="header-container">KP1 <svg class="arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 16l-6-6h12z" fill="currentColor"/></svg></span></th>
                        <th id="kp2-header-100km"><span class="header-container">KP2 <svg class="arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 16l-6-6h12z" fill="currentColor"/></svg></span></th>
                        <th id="kp3-header-100km"><span class="header-container">KP3 <svg class="arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 16l-6-6h12z" fill="currentColor"/></svg></span></th>
                        <th id="finiss-header-100km"><span class="header-container">Finišs <svg class="arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 16l-6-6h12z" fill="currentColor"/></svg></span></th>
                        <th id="laiks-header-100km"><span class="header-container">Laiks <svg class="arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 16l-6-6h12z" fill="currentColor"/></svg></span></th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </section>
    <section class="table-panel">
        <h2 class="table-title">50km Dalībnieki</h2>
        <div class="table-scroll" data-table="other">
            <table id="participants-table-other" class="results-table">
                <thead>
                    <tr>
                        <th class="row-index">Nr.p.k.</th>
                        <th id="name-header-other"><span class="header-container">Vārds <svg class="arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 16l-6-6h12z" fill="currentColor"/></svg></span></th>
                        <th id="surname-header-other"><span class="header-container">Uzvārds <svg class="arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 16l-6-6h12z" fill="currentColor"/></svg></span></th>
                        <th id="starts-header-other"><span class="header-container">Starts <svg class="arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 16l-6-6h12z" fill="currentColor"/></svg></span></th>
                        <th id="kp1-header-other"><span class="header-container">KP1 <svg class="arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 16l-6-6h12z" fill="currentColor"/></svg></span></th>
                        <th id="kp2-header-other"><span class="header-container">Finišs <svg class="arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 16l-6-6h12z" fill="currentColor"/></svg></span></th>
                        <th id="laiks-header-other"><span class="header-container">Laiks <svg class="arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 16l-6-6h12z" fill="currentColor"/></svg></span></th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </section>
</div>
</body>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.1.3/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/9.1.3/firebase-firestore.js";
    import firebaseConfig from './firebaseconfig.js';

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const sortStates = {
        '100km': { columnIndex: 2, ascending: true },
        'other': { columnIndex: 2, ascending: true }
    };

document.addEventListener('DOMContentLoaded', async () => {
    const table100Body = document.querySelector('#participants-table-100km tbody');
    const tableOtherBody = document.querySelector('#participants-table-other tbody');
    const scrollContainers = document.querySelectorAll('.table-scroll');

    try {
        const q = query(collection(db, 'pieteikums100km2026'), orderBy('submissionTime'));
        const querySnapshot = await getDocs(q);

        querySnapshot.forEach((docSnapshot) => {
            const data = docSnapshot.data();
            if (data.hide) return;

            const row = createParticipantRow(data);
            if (row && row.dataset.group === '100km') {
                table100Body.appendChild(row);
            } else if (row) {
                tableOtherBody.appendChild(row);
            }
        });

        sortTable('100km', 2, true);
        sortTable('other', 2, true);
    } catch (error) {
        console.error("Error getting documents: ", error);
    }

    document.getElementById('name-header-100km').addEventListener('click', () => toggleSort('100km', 1));
    document.getElementById('surname-header-100km').addEventListener('click', () => toggleSort('100km', 2));
    document.getElementById('starts-header-100km').addEventListener('click', () => toggleSort('100km', 3));
    document.getElementById('kp1-header-100km').addEventListener('click', () => toggleSort('100km', 4));
    document.getElementById('kp2-header-100km').addEventListener('click', () => toggleSort('100km', 5));
    document.getElementById('kp3-header-100km').addEventListener('click', () => toggleSort('100km', 6));
    document.getElementById('finiss-header-100km').addEventListener('click', () => toggleSort('100km', 7));
    document.getElementById('laiks-header-100km').addEventListener('click', () => toggleSort('100km', 8));

    document.getElementById('name-header-other').addEventListener('click', () => toggleSort('other', 1));
    document.getElementById('surname-header-other').addEventListener('click', () => toggleSort('other', 2));
    document.getElementById('starts-header-other').addEventListener('click', () => toggleSort('other', 3));
    document.getElementById('kp1-header-other').addEventListener('click', () => toggleSort('other', 4));
    document.getElementById('kp2-header-other').addEventListener('click', () => toggleSort('other', 5));
    document.getElementById('laiks-header-other').addEventListener('click', () => toggleSort('other', 6));

let directions = new Map();
const positions = new Map();
    scrollContainers.forEach(container => {
        directions.set(container, 1);
        positions.set(container, 0);
    });

    setInterval(() => {
        scrollContainers.forEach(container => {
            const maxScroll = container.scrollHeight - container.clientHeight;
            if (maxScroll <= 0) return;
            const direction = directions.get(container) || 1;
            const step = 0.3;
            let pos = positions.get(container);
            pos += direction * step;

            if (pos >= maxScroll) {
                pos = maxScroll;
                directions.set(container, -1);
            } else if (pos <= 0) {
                pos = 0;
                directions.set(container, 1);
            }

            positions.set(container, pos);
            container.scrollTop = pos;
        });
    }, 20);});

function createParticipantRow(data) {
    const is100km = normalizeDistance(data.distance) === 100;
    const formattedstarts = formatTime(data.starts, data.izstajies);
    const formattedkp1 = formatTime(data.KP1, data.izstajies);
    const formattedkp2 = formatTime(data.KP2, data.izstajies);
    const formattedkp3 = formatTime(data.KP3, data.izstajies);
    const formattedfiniss = formatTime(data.finiss, data.izstajies);

    const row = document.createElement('tr');
    row.dataset.group = is100km ? '100km' : 'other';

    if (is100km) {
        row.innerHTML = `
            <td class="row-index">1</td>
            <td>${data.vards || ''}</td>
            <td>${data.uzvards || ''}</td>
            <td data-starts="${data.starts || ''}">${formattedstarts}</td>
            <td data-kp1="${data.KP1 || ''}">${formattedkp1}</td>
            <td data-kp2="${data.KP2 || ''}">${formattedkp2}</td>
            <td data-kp3="${data.KP3 || ''}">${formattedkp3}</td>
            <td data-kp4="${data.finiss || ''}">${formattedfiniss}</td>
            <td>${calculateFullLaiks(data.starts, data.KP1, data.KP2, data.KP3, data.finiss, data.izstajies)}</td>
        `;
    } else {
        row.innerHTML = `
            <td class="row-index">1</td>
            <td>${data.vards || ''}</td>
            <td>${data.uzvards || ''}</td>
            <td data-starts="${data.starts || ''}">${formattedstarts}</td>
            <td data-kp1="${data.KP1 || ''}">${formattedkp1}</td>
            <td data-kp2="${data.KP2 || ''}">${formattedkp2}</td>
            <td>${calculateShortLaiks(data.starts, data.KP1, data.KP2)}</td>
        `;
    }

    return row;
}

function normalizeDistance(distance) {
    if (distance === null || distance === undefined) return null;
    const normalized = String(distance).toLowerCase().replace(/\s+/g, '');
    if (normalized.includes('100') && normalized.includes('km')) return 100;
    if (/^100$/.test(normalized.replace('km', ''))) return 100;
    const match = normalized.match(/(\d+)/);
    return match ? Number(match[1]) : null;
}

function calculateFullLaiks(starts, kp1, kp2, kp3, finish, izstajies) {
    const parseDate = (time) => {
        if (!time) return null;
        const [datePart, timePart] = time.split(' ');
        if (!datePart || !timePart) return null;
        const [day, month, year] = datePart.split('/').map(Number);
        const [hours, minutes, seconds] = timePart.split(':').map(Number);
        return new Date(year, month - 1, day, hours, minutes, seconds);
    };

    if (izstajies) {
        const start = parseDate(starts);
        const checkpoints = [finish, kp3, kp2, kp1, starts].map(parseDate);
        const lastKP = checkpoints.find(Boolean);

        if (!start || !lastKP) return '<span class="dnf">DNF</span>';

        const diffMs = lastKP - start;
        const hours = Math.floor(diffMs / (1000 * 60 * 60));
        const minutes = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));

        return `<span class="dnf">DNF</span> <span class="partial">(${hours}h ${minutes}m)</span>`;
    }

    if (!starts || !finish) return '-';
    const start = parseDate(starts);
    const end = parseDate(finish);
    if (!start || !end) return '-';

    const diffMs = end - start;
    const hours = Math.floor(diffMs / (1000 * 60 * 60));
    const minutes = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
    return `${hours}h ${minutes}m`;
}

function calculateShortLaiks(starts, kp1, kp2) {
    if (!starts || !kp1 || !kp2) return '-';
    const start = parseDate(starts);
    const kp2Time = parseDate(kp2);
    if (!start || !kp2Time) return '-';

    const diffMs = kp2Time - start;
    const hours = Math.floor(diffMs / (1000 * 60 * 60));
    const minutes = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
    return `${hours}h ${minutes}m`;
}

function parseDate(time) {
    if (!time) return null;
    const [datePart, timePart] = time.split(' ');
    if (!datePart || !timePart) return null;
    const [day, month, year] = datePart.split('/').map(Number);
    const [hours, minutes, seconds] = timePart.split(':').map(Number);
    return new Date(year, month - 1, day, hours, minutes, seconds);
}

function toggleSort(tableKey, columnIndex) {
    const state = sortStates[tableKey];
    state.ascending = state.columnIndex === columnIndex ? !state.ascending : true;
    state.columnIndex = columnIndex;
    sortTable(tableKey, columnIndex, state.ascending);
}

function formatTime(time, izstajies) {
    if (!time && !izstajies) return '-';
    if (!time && izstajies) return 'DNF';
    const parts = time.split(' ')[1]?.split(':');
    if (!parts || parts.length < 2) return '-';
    if (parts[0].startsWith('0')) return `${parts[0].substring(1)}:${parts[1]}`;
    return `${parts[0]}:${parts[1]}`;
}

function sortTable(tableKey, columnIndex, ascending) {
    const tbody = document.querySelector(tableKey === '100km' ? '#participants-table-100km tbody' : '#participants-table-other tbody');
    const rows = Array.from(tbody.querySelectorAll('tr'));
    resetArrows();

    rows.sort((a, b) => {
        const cellA = a.cells[columnIndex].textContent.trim();
        const cellB = b.cells[columnIndex].textContent.trim();

        if (tableKey === '100km') {
            if (columnIndex >= 3 && columnIndex <= 7) {
                const rawTimeA = getRawTimeValue(a, columnIndex, '100km');
                const rawTimeB = getRawTimeValue(b, columnIndex, '100km');
                return ascending ? compareTimes(rawTimeA, rawTimeB) : compareTimes(rawTimeB, rawTimeA);
            } else if (columnIndex === 8) {
                return compareDuration(cellA, cellB, ascending);
            }
        } else if (tableKey === 'other') {
            if (columnIndex >= 3 && columnIndex <= 5) {
                const rawTimeA = getRawTimeValue(a, columnIndex, 'other');
                const rawTimeB = getRawTimeValue(b, columnIndex, 'other');
                return ascending ? compareTimes(rawTimeA, rawTimeB) : compareTimes(rawTimeB, rawTimeA);
            } else if (columnIndex === 6) {
                return compareDuration(cellA, cellB, ascending);
            }
        }

        return ascending ? cellA.localeCompare(cellB) : cellB.localeCompare(cellA);
    });

    rows.forEach(row => tbody.appendChild(row));

    tbody.querySelectorAll('tr').forEach((row, index) => {
        row.querySelector('.row-index').textContent = index + 1;
    });

    updateArrow(tableKey, columnIndex, ascending);
}

function getRawTimeValue(row, columnIndex, tableKey) {
    if (columnIndex === 3) return row.cells[3].getAttribute('data-starts') || '';
    if (columnIndex === 4) return row.cells[4].getAttribute('data-kp1') || '';
    if (columnIndex === 5) return row.cells[5].getAttribute('data-kp2') || '';
    if (columnIndex === 6 && tableKey === '100km') return row.cells[6].getAttribute('data-kp3') || '';
    if (columnIndex === 7 && tableKey === '100km') return row.cells[7].getAttribute('data-kp4') || '';
    return '';
}

function compareDuration(timeA, timeB, ascending = true) {
    const parseDuration = (time) => {
        if (!time || time === '-')
            return { dnf: false, minutes: Infinity };

        if (!time.includes('DNF')) {
            const match = time.match(/(\d+)h\s+(\d+)m/);
            if (match) {
                return {
                    dnf: false,
                    minutes: (+match[1] * 60) + (+match[2])
                };
            }
        }

        const match = time.match(/DNF(?:\s*\((\d+)h\s+(\d+)m\))?/);
        if (match) {
            const h = match[1] ? +match[1] : Infinity;
            const m = match[2] ? +match[2] : Infinity;
            return {
                dnf: true,
                minutes: (h * 60) + m
            };
        }

        return { dnf: true, minutes: Infinity };
    };

    const a = parseDuration(timeA);
    const b = parseDuration(timeB);

    if (a.dnf !== b.dnf) {
        return a.dnf ? 1 : -1;
    }

    return ascending ? a.minutes - b.minutes : b.minutes - a.minutes;
}

function compareTimes(timeA, timeB) {
    if (!timeA || timeA === '-' || timeA === 'DNF') return 1;
    if (!timeB || timeB === '-' || timeB === 'DNF') return -1;
    return parseDate(timeA) - parseDate(timeB);
}

function resetArrows() {
    document.querySelectorAll('.arrow').forEach(arrow => {
        arrow.classList.remove('sorted');
        arrow.style.transform = 'scale(1) rotate(0deg)';
    });
}

function updateArrow(tableKey, columnIndex, ascending) {
    const headerId = getHeaderId(tableKey, columnIndex);
    if (!headerId) return;
    const arrow = document.querySelector(`#${headerId} .arrow`);
    if (!arrow) return;
    arrow.classList.add('sorted');
    arrow.style.transform = `scale(1.5) rotate(${ascending ? 0 : 180}deg)`;
}

function getHeaderId(tableKey, columnIndex) {
    const ids = {
        '100km': [null, 'name-header-100km', 'surname-header-100km', 'starts-header-100km', 'kp1-header-100km', 'kp2-header-100km', 'kp3-header-100km', 'finiss-header-100km', 'laiks-header-100km'],
        'other': [null, 'name-header-other', 'surname-header-other', 'starts-header-other', 'kp1-header-other', 'kp2-header-other', 'laiks-header-other']
    };
    return ids[tableKey][columnIndex] || null;
}

function filterTable(searchTerm) {
    const rows = document.querySelectorAll('.results-table tbody tr');
    const normalizedSearchTerm = searchTerm.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    rows.forEach(row => {
        const textContent = row.textContent.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
        row.style.display = textContent.includes(normalizedSearchTerm) ? '' : 'none';
    });
}
</script>
</html>
