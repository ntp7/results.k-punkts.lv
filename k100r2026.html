    function setupTableToggle() {

        const buttons =
            document.querySelectorAll(
                ".toggle-btn"

        const panels =
            document.querySelectorAll(
                ".table-panel"
            );


        buttons.forEach(
            (button) => {

                button.addEventListener(
                    "click",
                    () => {

                        const target =
                            button.dataset.target;


                        buttons.forEach(
                            (btn) => {

                                btn.classList.toggle(
                                    "active",
                                    btn === button
                                );

                            }
                        );


                        panels.forEach(
                            (panel) => {

                                const isActive =
                                    panel.dataset.table ===
                                    target;


                                panel.classList.toggle(
                                    "active",
                                    isActive
                                );


                                panel.classList.toggle(
                                    "hidden",
                                    !isActive
                                );

                            }
                        );


                        filterTable(
                            document
                                .getElementById(
                                    "search-input"
                                )
                                .value
                        );

                    }
                );

            }
        );

    }

                data.starts,
                data.izstajies

    // =========================================================
    // NORMALIZE DISTANCE
    // =========================================================

    function normalizeDistance(
        distance
    ) {

        if (
            distance === null ||
            distance === undefined
        ) {

            return null;

        }


        const normalized =
            String(distance)
                .toLowerCase()
                .replace(
                    /\s+/g,
                    ""
                );


        if (
            normalized.includes("100") &&
            normalized.includes("km")
        ) {

            return 100;

        }


        if (
            /^100$/.test(
                normalized.replace(
                    "km",
                    ""
                )
            )
        ) {

            return 100;

        }


        const match =
            normalized.match(
                /(\d+)/
            );


        return match
            ? Number(match[1])
            : null;

    }


    // =========================================================
    // CALCULATE FULL 100 KM TIME
    // =========================================================

    function calculateFullLaiks(
        starts,
        kp1,
        kp2,
        kp3,
        finish,
        izstajies
    ) {


        // -----------------------------------------------------
        // Parse date
        // -----------------------------------------------------

        const parseDate =
            (time) => {

                if (!time) {
                    return null;
                }


                const parts =
                    time.split(" ");


                if (
                    parts.length !== 2
                ) {

                    return null;

                }


                const dateParts =
                    parts[0]
                        .split("/")
                        .map(Number);


                const timeParts =
                    parts[1]
                        .split(":")
                        .map(Number);


                if (
                    dateParts.length !== 3 ||
                    timeParts.length < 2
                ) {

                    return null;

                }


                return new Date(
                    dateParts[2],
                    dateParts[1] - 1,
                    dateParts[0],
                    timeParts[0],
                    timeParts[1],
                    timeParts[2] || 0
                );

            };


        // -----------------------------------------------------
        // DNF
        // -----------------------------------------------------

        if (izstajies) {


            const start =
                parseDate(
                    starts
                );


            const checkpoints = [
                finish,
                kp3,
                kp2,
                kp1,
                starts
            ];


            const lastKP =
                checkpoints
                    .map(parseDate)
                    .find(Boolean);


            if (
                !start ||
                !lastKP
            ) {

                return `
                    <span class="dnf">
                        DNF
                    </span>
                `;

            }


            const diffMs =
                lastKP - start;


            const hours =
                Math.floor(
                    diffMs /
                    (1000 * 60 * 60)
                );


            const minutes =
                Math.floor(
                    (
                        diffMs %
                        (1000 * 60 * 60)
                    ) /
                    (1000 * 60)
                );


            return `
                <span class="dnf">
                    DNF
                </span>

                <span class="partial">
                    (${hours}h ${minutes}m)
                </span>
            `;

        }


        // -----------------------------------------------------
        // Normal finish
        // -----------------------------------------------------

        if (
            !starts ||
            !finish
        ) {

            return "-";

        }


        const start =
            parseDate(
                starts
            );


        const end =
            parseDate(
                finish
            );


        if (
            !start ||
            !end
        ) {

            return "-";

        }


        const diffMs =
            end - start;


        const hours =
            Math.floor(
                diffMs /
                (1000 * 60 * 60)
            );


        const minutes =
            Math.floor(
                (
                    diffMs %
                    (1000 * 60 * 60)
                ) /
                (1000 * 60)
            );


        return `${hours}h ${minutes}m`;

    }

    ) {

        if (
            !starts ||
            !kp1 ||
            !kp2
        ) {

            return "-";

        }


        const start =
            parseDate(
                starts
            );


        const finish =
            parseDate(
                kp2
            );


        if (
            !start ||
            !finish
        ) {

            return "-";

        }


        const diffMs =
            finish - start;


        const hours =
            Math.floor(
                diffMs /
                (1000 * 60 * 60)
            );


        const minutes =
            Math.floor(
                (
                    diffMs %
                    (1000 * 60 * 60)
                ) /
                (1000 * 60)
            );


        return `${hours}h ${minutes}m`;

    }


    // =========================================================
    // GENERAL DATE PARSER
    // =========================================================

    function parseDate(
        time
    ) {

        if (!time) {
            return null;
        }


        const parts =
            time.split(" ");


        if (
            parts.length !== 2
        ) {

            return null;

        }


        const dateParts =
            parts[0]
                .split("/")
                .map(Number);


        const timeParts =
            parts[1]
                .split(":")
                .map(Number);


        if (
            dateParts.length !== 3 ||
            timeParts.length < 2
        ) {

            return null;

        }


        return new Date(
            dateParts[2],
            dateParts[1] - 1,
            dateParts[0],
            timeParts[0],
            timeParts[1],
            timeParts[2] || 0
        );

    }


    // =========================================================
    // FORMAT TIME
    // =========================================================

    function formatTime(
        time,
        izstajies
    ) {

        if (
            !time &&
            !izstajies
        ) {

            return "-";

        }


        if (
            !time &&
            izstajies
        ) {

            return "DNF";

        }


        const parts =
            time
                ?.split(" ")[1]
                ?.split(":");


        if (
            !parts ||
            parts.length < 2
        ) {

            return "-";

        }


        const hours =
            String(
                Number(parts[0])
            );


        return `${hours}:${parts[1]}`;

    }


    // =========================================================
    // TOGGLE SORT
    // =========================================================

    function toggleSort(
        tableKey,
        columnIndex
    ) {

        const state =
            sortStates[
                tableKey
            ];


        state.ascending =
            state.columnIndex ===
            columnIndex
                ? !state.ascending
                : true;


        state.columnIndex =
            columnIndex;


        sortTable(
            tableKey,
            columnIndex,
            state.ascending
        );

    }


    // =========================================================
    // SORT TABLE
    // =========================================================

    function sortTable(
        tableKey,
        columnIndex,
        ascending
    ) {

        const tbody =
            document.querySelector(
                tableKey === "100km"
                    ? "#participants-table-100km tbody"
                    : "#participants-table-other tbody"
            );


        const rows =
            Array.from(
                tbody.querySelectorAll(
                    "tr"
                )
            );


        resetArrows();


        rows.sort(
            (a, b) => {

                const cellA =
                    a.cells[columnIndex]
                        .textContent
                        .trim();


                const cellB =
                    b.cells[columnIndex]
                        .textContent
                        .trim();


                // =============================================
                // 100 KM
                // =============================================

                if (
                    tableKey === "100km"
                ) {


                    if (
                        columnIndex >= 3 &&
                        columnIndex <= 7
                    ) {

                        const rawTimeA =
                            getRawTimeValue(
                                a,
                                columnIndex,
                                tableKey
                            );


                        const rawTimeB =
                            getRawTimeValue(
                                b,
                                columnIndex,
                                tableKey
                            );


                        return ascending
                            ? compareTimes(
                                rawTimeA,
                                rawTimeB
                            )
                            : compareTimes(
                                rawTimeB,
                                rawTimeA
                            );

                    }


                    if (
                        columnIndex === 8
                    ) {

                        return compareDuration(
                            cellA,
                            cellB,
                            ascending
                        );

                    }

                }


                // =============================================
                // 50 KM
                // =============================================

                if (
                    tableKey === "other"
                ) {


                    if (
                        columnIndex >= 3 &&
                        columnIndex <= 5
                    ) {

                        const rawTimeA =
                            getRawTimeValue(
                                a,
                                columnIndex,
                                tableKey
                            );


                        const rawTimeB =
                            getRawTimeValue(
                                b,
                                columnIndex,
                                tableKey
                            );


                        return ascending
                            ? compareTimes(
                                rawTimeA,
                                rawTimeB
                            )
                            : compareTimes(
                                rawTimeB,
                                rawTimeA
                            );

                    }


                    if (
                        columnIndex === 6
                    ) {

                        return compareDuration(
                            cellA,
                            cellB,
                            ascending
                        );

                    }

                }


                // =============================================
                // TEXT
                // =============================================

                return ascending

                    ? cellA.localeCompare(
                        cellB,
                        "lv"
                    )

                    : cellB.localeCompare(
                        cellA,
                        "lv"
                    );

            }
        );


        rows.forEach(
            row =>
                tbody.appendChild(
                    row
                )
        );


        // Re-number rows.

        tbody
            .querySelectorAll(
                "tr"
            )
            .forEach(
                (row, index) => {

                    row
                        .querySelector(
                            ".row-index"
                        )
                        .textContent =
                            index + 1;

                }
            );


        updateArrow(
            tableKey,
            columnIndex,
            ascending
        );

    }


    // =========================================================
    // GET RAW TIME VALUE
    // =========================================================

    function getRawTimeValue(
        row,
        columnIndex,
        tableKey
    ) {

        if (
            columnIndex === 3
        ) {

            return (
                row.cells[3]
                    .dataset.starts ||
                ""
            );

        }


        if (
            columnIndex === 4
        ) {

            return (
                row.cells[4]
                    .dataset.kp1 ||
                ""
            );

        }


        if (
            columnIndex === 5
        ) {

            return (
                row.cells[5]
                    .dataset.kp2 ||
                ""
            );

        }


        if (
            columnIndex === 6 &&
            tableKey === "100km"
        ) {

            return (
                row.cells[6]
                    .dataset.kp3 ||
                ""
            );

        }


        if (
            columnIndex === 7 &&
            tableKey === "100km"
        ) {

            return (
                row.cells[7]
                    .dataset.finiss ||
                ""
            );

        }


        return "";

    }


    // =========================================================
    // COMPARE TIMES
    // =========================================================

    function compareTimes(
        timeA,
        timeB
    ) {

        const dateA =
            parseDate(
                timeA
            );


        const dateB =
            parseDate(
                timeB
            );


        if (
            !dateA &&
            !dateB
        ) {

            return 0;

        }


        if (!dateA) {
            return 1;
        }


        if (!dateB) {
            return -1;
        }


        return dateA - dateB;

    }


    // =========================================================
    // COMPARE DURATIONS
    // =========================================================

    function compareDuration(
        timeA,
        timeB,
        ascending = true
    ) {

        const a =
            parseDuration(
                timeA
            );


        const b =
            parseDuration(
                timeB
            );


        // DNF always last.

        if (
            a.dnf !== b.dnf
        ) {

            return a.dnf
                ? 1
                : -1;

        }


        return ascending

            ? a.minutes - b.minutes

            : b.minutes - a.minutes;

    }


    // =========================================================
    // PARSE DURATION
    // =========================================================

    function parseDuration(
        time
    ) {

        if (
            !time ||
            time === "-"
        ) {

            return {

                dnf: false,

                minutes: Infinity

            };

        }


        if (
            !time.includes(
                "DNF"
            )
        ) {

            const match =
                time.match(
                    /(\d+)h\s+(\d+)m/
                );


            if (match) {

                return {

                    dnf: false,

                    minutes:
                        Number(
                            match[1]
                        ) * 60
                        +
                        Number(
                            match[2]
                        )

                };

            }

        }


        const dnfMatch =
            time.match(
                /DNF(?:\s*\((\d+)h\s+(\d+)m\))?/
            );


        if (dnfMatch) {

            const hours =
                dnfMatch[1]
                    ? Number(
                        dnfMatch[1]
                    )
                    : Infinity;


            const minutes =
                dnfMatch[2]
                    ? Number(
                        dnfMatch[2]
                    )
                    : Infinity;


            return {

                dnf: true,

                minutes:
                    hours * 60 +
                    minutes

            };

        }


        return {

            dnf: true,

            minutes: Infinity

        };

    }


    // =========================================================
    // RESET ARROWS
    // =========================================================

    function resetArrows() {

        document
            .querySelectorAll(
                ".arrow"
            )
            .forEach(
                arrow => {

                    arrow
                        .classList
                        .remove(
                            "sorted"
                        );


                    arrow.style.transform =
                        "scale(1) rotate(0deg)";

                }
            );

    }


    // =========================================================
    // UPDATE ARROW
    // =========================================================

    function updateArrow(
        tableKey,
        columnIndex,
        ascending
    ) {

        const headerId =
            getHeaderId(
                tableKey,
                columnIndex
            );


        if (!headerId) {
            return;
        }


        const arrow =
            document.querySelector(
                `#${headerId} .arrow`
            );


        if (!arrow) {
            return;
        }


        arrow
            .classList
            .add("sorted");


        arrow.style.transform =
            `scale(1.5) rotate(${ascending ? 0 : 180}deg)`;

    }


    // =========================================================
    // HEADER ID
    // =========================================================

    function getHeaderId(
        tableKey,
        columnIndex
    ) {

        const ids = {

            "100km": [

                null,

                "name-header-100km",

                "surname-header-100km",

                "starts-header-100km",

                "kp1-header-100km",

                "kp2-header-100km",

                "kp3-header-100km",

                "finiss-header-100km",

                "laiks-header-100km"

            ],


            "other": [

                null,

                "name-header-other",

                "surname-header-other",

                "starts-header-other",

                "kp1-header-other",

                "kp2-header-other",

                "laiks-header-other"

            ]

        };


        return (
            ids[tableKey]?.[
                columnIndex
            ] || null
        );

    }


    // =========================================================
    // SEARCH
    // =========================================================

    function filterTable(
        searchTerm
    ) {

        const normalizedSearchTerm =
            normalizeText(
                searchTerm
            );


        const activePanel =
            document.querySelector(
                ".table-panel.active"
            );


        if (!activePanel) {
            return;
        }


        const rows =
            activePanel.querySelectorAll(
                ".results-table tbody tr"
            );


        rows.forEach(
            row => {

                const textContent =
                    normalizeText(
                        row.textContent
                    );


                row.style.display =
                    textContent.includes(
                        normalizedSearchTerm
                    )
                        ? ""
                        : "none";

            }
        );

    }


    // =========================================================
    // NORMALIZE SEARCH TEXT
    // =========================================================

    function normalizeText(
        value
    ) {

        return String(
            value
        )
            .normalize(
                "NFD"
            )
            .replace(
                /[\u0300-\u036f]/g,
                ""
            )
            .toLowerCase();

    }


</script>
