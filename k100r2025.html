    <script type="module">

        // =========================================================
        // FIREBASE
        // =========================================================

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/9.1.3/firebase-app.js";


        import {
            getFirestore,
            collection,
            getDocs
        } from "https://www.gstatic.com/firebasejs/9.1.3/firebase-firestore.js";


        // Public Firebase WEB configuration.
        // Safe to expose in frontend code.
        const firebaseConfig = {

            apiKey:
                "AIzaSyBMb0jBPIDPdKJhvw8EdTT8zDIjmh9n4Uk",

            authDomain:
                "kpunkts-617f1.firebaseapp.com",

            projectId:
                "kpunkts-617f1",

            storageBucket:
                "kpunkts-617f1.appspot.com",

            messagingSenderId:
                "402643964732",

            appId:
                "1:402643964732:web:5d15d7317ace4554a94439"

        };


        const app =
            initializeApp(firebaseConfig);


        const db =
            getFirestore(app);


        // =========================================================
        // IMPORTANT
        // =========================================================
        //
        // This page ONLY reads the public collection.
        //
        // It NEVER reads:
        //
        // pieteikums100km2025
        //
        // It reads:
        //
        // pieteikums100km2025_public
        // =========================================================

        const PUBLIC_COLLECTION =
            "pieteikums100km2025_public";


        // =========================================================
        // SORT STATE
        // =========================================================

        let currentSortedColumn = 1;

        let isAscending = true;


        // =========================================================
        // LOAD PARTICIPANTS
        // =========================================================

        document.addEventListener(
            "DOMContentLoaded",
            async () => {

                const tableBody =
                    document.querySelector(
                        "#participants-table tbody"
                    );


                const searchInput =
                    document.getElementById(
                        "search-input"
                    );


                try {

                    // -------------------------------------------------
                    // READ ONLY PUBLIC COLLECTION
                    // -------------------------------------------------

                    const querySnapshot =
                        await getDocs(
                            collection(
                                db,
                                PUBLIC_COLLECTION
                            )
                        );


                    querySnapshot.forEach(
                        (docSnapshot) => {

                            const data =
                                docSnapshot.data();


                            // Hide records marked as hidden.
                            //
                            // "hide" is optional in the public
                            // collection. If it is not there,
                            // the participant is shown.

                            if (data.hide === true) {
                                return;
                            }


                            const formattedStarts =
                                formatTime(
                                    data.starts,
                                    data.izstajies
                                );


                            const formattedKP1 =
                                formatTime(
                                    data.KP1,
                                    data.izstajies
                                );


                            const formattedKP2 =
                                formatTime(
                                    data.KP2,
                                    data.izstajies
                                );


                            const formattedKP3 =
                                formatTime(
                                    data.KP3,
                                    data.izstajies
                                );


                            const formattedFiniss =
                                formatTime(
                                    data.finiss,
                                    data.izstajies
                                );


                            const row =
                                createParticipantRow(
                                    data,
                                    formattedStarts,
                                    formattedKP1,
                                    formattedKP2,
                                    formattedKP3,
                                    formattedFiniss
                                );


                            tableBody.appendChild(row);

                        }
                    );


                    // Initial sort by first name.
                    sortTable(
                        1,
                        true
                    );


                } catch (error) {

                    console.error(
                        "Error loading public participants:",
                        error
                    );

                }


                // =====================================================
                // SORT BUTTONS
                // =====================================================

                document
                    .getElementById(
                        "name-header"
                    )
                    .addEventListener(
                        "click",
                        () => toggleSort(1)
                    );


                document
                    .getElementById(
                        "surname-header"
                    )
                    .addEventListener(
                        "click",
                        () => toggleSort(2)
                    );


                document
                    .getElementById(
                        "starts-header"
                    )
                    .addEventListener(
                        "click",
                        () => toggleSort(3)
                    );


                document
                    .getElementById(
                        "kp1-header"
                    )
                    .addEventListener(
                        "click",
                        () => toggleSort(4)
                    );


                document
                    .getElementById(
                        "kp2-header"
                    )
                    .addEventListener(
                        "click",
                        () => toggleSort(5)
                    );


                document
                    .getElementById(
                        "kp3-header"
                    )
                    .addEventListener(
                        "click",
                        () => toggleSort(6)
                    );


                document
                    .getElementById(
                        "finiss-header"
                    )
                    .addEventListener(
                        "click",
                        () => toggleSort(7)
                    );


                document
                    .getElementById(
                        "laiks-header"
                    )
                    .addEventListener(
                        "click",
                        () => toggleSort(8)
                    );


                // =====================================================
                // SEARCH
                // =====================================================

                searchInput.addEventListener(
                    "input",
                    () => {

                        filterTable(
                            searchInput.value
                        );

                    }
                );

            }
        );


        // =========================================================
        // CREATE PARTICIPANT ROW
        // =========================================================

        function createParticipantRow(
            data,
            formattedStarts,
            formattedKP1,
            formattedKP2,
            formattedKP3,
            formattedFiniss
        ) {

            const row =
                document.createElement("tr");


            // -------------------------------------------------------
            // ROW NUMBER
            // -------------------------------------------------------

            const numberCell =
                document.createElement("td");


            numberCell.className =
                "row-index";


            numberCell.textContent =
                "0";


            row.appendChild(
                numberCell
            );


            // -------------------------------------------------------
            // FIRST NAME
            // -------------------------------------------------------

            const nameCell =
                document.createElement("td");


            nameCell.textContent =
                data.vards || "";


            row.appendChild(
                nameCell
            );


            // -------------------------------------------------------
            // SURNAME
            // -------------------------------------------------------

            const surnameCell =
                document.createElement("td");


            surnameCell.textContent =
                data.uzvards || "";


            row.appendChild(
                surnameCell
            );


            // -------------------------------------------------------
            // START
            // -------------------------------------------------------

            const startsCell =
                createTimeCell(
                    "starts",
                    data.starts,
                    formattedStarts
                );


            row.appendChild(
                startsCell
            );


            // -------------------------------------------------------
            // KP1
            // -------------------------------------------------------

            const kp1Cell =
                createTimeCell(
                    "kp1",
                    data.KP1,
                    formattedKP1
                );


            row.appendChild(
                kp1Cell
            );


            // -------------------------------------------------------
            // KP2
            // -------------------------------------------------------

            const kp2Cell =
                createTimeCell(
                    "kp2",
                    data.KP2,
                    formattedKP2
                );


            row.appendChild(
                kp2Cell
            );


            // -------------------------------------------------------
            // KP3
            // -------------------------------------------------------

            const kp3Cell =
                createTimeCell(
                    "kp3",
                    data.KP3,
                    formattedKP3
                );


            row.appendChild(
                kp3Cell
            );


            // -------------------------------------------------------
            // FINISH
            // -------------------------------------------------------

            const finishCell =
                createTimeCell(
                    "finiss",
                    data.finiss,
                    formattedFiniss
                );


            row.appendChild(
                finishCell
            );


            // -------------------------------------------------------
            // TOTAL TIME
            // -------------------------------------------------------

            const totalTimeCell =
                document.createElement("td");


            totalTimeCell.innerHTML =
                calculateLaiks(
                    data.starts,
                    data.KP1,
                    data.KP2,
                    data.KP3,
                    data.finiss,
                    data.izstajies
                );


            row.appendChild(
                totalTimeCell
            );


            return row;

        }


        // =========================================================
        // CREATE TIME CELL
        // =========================================================

        function createTimeCell(
            fieldName,
            rawValue,
            displayValue
        ) {

            const cell =
                document.createElement("td");


            cell.dataset[fieldName] =
                rawValue || "";


            cell.textContent =
                displayValue;


            return cell;

        }


        // =========================================================
        // CALCULATE TOTAL TIME
        // =========================================================

        function calculateLaiks(
            starts,
            kp1,
            kp2,
            kp3,
            finish,
            izstajies
        ) {


            // -------------------------------------------------------
            // PARSE DATE
            // Format:
            // DD/MM/YYYY HH:mm:ss
            // -------------------------------------------------------

            const parseDate =
                (time) => {

                    if (!time) {
                        return null;
                    }


                    const parts =
                        time.split(" ");


                    if (
                        parts.length !== 2
                    ) {

                        return null;

                    }


                    const dateParts =
                        parts[0]
                            .split("/")
                            .map(Number);


                    const timeParts =
                        parts[1]
                            .split(":")
                            .map(Number);


                    if (
                        dateParts.length !== 3 ||
                        timeParts.length < 2
                    ) {

                        return null;

                    }


                    const [
                        day,
                        month,
                        year
                    ] =
                        dateParts;


                    const [
                        hours,
                        minutes,
                        seconds = 0
                    ] =
                        timeParts;


                    return new Date(
                        year,
                        month - 1,
                        day,
                        hours,
                        minutes,
                        seconds
                    );

                };


            // -------------------------------------------------------
            // DNF
            // -------------------------------------------------------

            if (izstajies) {

                const start =
                    parseDate(starts);


                const checkpoints = [
                    finish,
                    kp3,
                    kp2,
                    kp1,
                    starts
                ];


                const lastKnown =
                    checkpoints
                        .map(parseDate)
                        .find(Boolean);


                if (
                    !start ||
                    !lastKnown
                ) {

                    return `
                        <span class="dnf">
                            DNF
                        </span>
                    `;

                }


                const diffMs =
                    lastKnown - start;


                const hours =
                    Math.floor(
                        diffMs /
                        (1000 * 60 * 60)
                    );


                const minutes =
                    Math.floor(
                        (
                            diffMs %
                            (1000 * 60 * 60)
                        ) /
                        (1000 * 60)
                    );


                return `
                    <span class="dnf">
                        DNF
                    </span>

                    <span class="partial">
                        (${hours}h ${minutes}m)
                    </span>
                `;

            }


            // -------------------------------------------------------
            // NORMAL FINISH
            // -------------------------------------------------------

            if (
                !starts ||
                !finish
            ) {

                return "-";

            }


            const start =
                parseDate(starts);


            const end =
                parseDate(finish);


            if (
                !start ||
                !end
            ) {

                return "-";

            }


            const diffMs =
                end - start;


            const hours =
                Math.floor(
                    diffMs /
                    (1000 * 60 * 60)
                );


            const minutes =
                Math.floor(
                    (
                        diffMs %
                        (1000 * 60 * 60)
                    ) /
                    (1000 * 60)
                );


            return `${hours}h ${minutes}m`;

        }


        // =========================================================
        // FORMAT TIME
        // =========================================================

        function formatTime(
            time,
            izstajies
        ) {

            if (
                !time &&
                !izstajies
            ) {

                return "-";

            }


            if (
                !time &&
                izstajies
            ) {

                return "DNF";

            }


            const parts =
                time
                    ?.split(" ")[1]
                    ?.split(":");


            if (
                !parts ||
                parts.length < 2
            ) {

                return "-";

            }


            const hours =
                String(
                    Number(parts[0])
                );


            return `
                ${hours}:${parts[1]}
            `;

        }


        // =========================================================
        // SORT TOGGLE
        // =========================================================

        function toggleSort(
            columnIndex
        ) {

            isAscending =
                currentSortedColumn === columnIndex
                    ? !isAscending
                    : true;


            currentSortedColumn =
                columnIndex;


            sortTable(
                columnIndex,
                isAscending
            );

        }


        // =========================================================
        // SORT TABLE
        // =========================================================

        function sortTable(
            columnIndex,
            ascending
        ) {

            const tbody =
                document.querySelector(
                    "#participants-table tbody"
                );


            const rows =
                Array.from(
                    tbody.querySelectorAll("tr")
                );


            resetArrows();


            rows.sort(
                (a, b) => {

                    const cellA =
                        a.cells[columnIndex]
                            .textContent
                            .trim();


                    const cellB =
                        b.cells[columnIndex]
                            .textContent
                            .trim();


                    // ------------------------------------------------
                    // START / KP1 / KP2 / KP3 / FINISH
                    // ------------------------------------------------

                    if (
                        columnIndex >= 3 &&
                        columnIndex <= 7
                    ) {

                        const fieldNames = [
                            "starts",
                            "kp1",
                            "kp2",
                            "kp3",
                            "finiss"
                        ];


                        const fieldName =
                            fieldNames[
                                columnIndex - 3
                            ];


                        const rawTimeA =
                            a.cells[columnIndex]
                                .dataset[
                                    fieldName
                                ] || "";


                        const rawTimeB =
                            b.cells[columnIndex]
                                .dataset[
                                    fieldName
                                ] || "";


                        return ascending
                            ? compareTimes(
                                rawTimeA,
                                rawTimeB
                            )
                            : compareTimes(
                                rawTimeB,
                                rawTimeA
                            );

                    }


                    // ------------------------------------------------
                    // TOTAL TIME
                    // ------------------------------------------------

                    if (
                        columnIndex === 8
                    ) {

                        return compareDuration(
                            cellA,
                            cellB,
                            ascending
                        );

                    }


                    // ------------------------------------------------
                    // TEXT
                    // ------------------------------------------------

                    return ascending
                        ? cellA.localeCompare(
                            cellB,
                            "lv"
                        )
                        : cellB.localeCompare(
                            cellA,
                            "lv"
                        );

                }
            );


            rows.forEach(
                row =>
                    tbody.appendChild(row)
            );


            // Re-number rows.

            tbody
                .querySelectorAll("tr")
                .forEach(
                    (row, index) => {

                        row
                            .querySelector(
                                ".row-index"
                            )
                            .textContent =
                                index + 1;

                    }
                );


            updateArrow(
                columnIndex,
                ascending
            );

        }


        // =========================================================
        // COMPARE TIMES
        // =========================================================

        function compareTimes(
            timeA,
            timeB
        ) {

            const dateA =
                parseDateForSort(timeA);


            const dateB =
                parseDateForSort(timeB);


            if (
                !dateA &&
                !dateB
            ) {

                return 0;

            }


            if (!dateA) {
                return 1;
            }


            if (!dateB) {
                return -1;
            }


            return dateA - dateB;

        }


        // =========================================================
        // PARSE TIME FOR SORTING
        // =========================================================

        function parseDateForSort(
            time
        ) {

            if (!time) {
                return null;
            }


            const parts =
                time.split(" ");


            if (
                parts.length !== 2
            ) {

                return null;

            }


            const dateParts =
                parts[0]
                    .split("/")
                    .map(Number);


            const timeParts =
                parts[1]
                    .split(":")
                    .map(Number);


            if (
                dateParts.length !== 3 ||
                timeParts.length < 2
            ) {

                return null;

            }


            return new Date(
                dateParts[2],
                dateParts[1] - 1,
                dateParts[0],
                timeParts[0],
                timeParts[1],
                timeParts[2] || 0
            );

        }


        // =========================================================
        // COMPARE TOTAL DURATIONS
        // =========================================================

        function compareDuration(
            timeA,
            timeB,
            ascending = true
        ) {

            const a =
                parseDuration(timeA);


            const b =
                parseDuration(timeB);


            // Always place DNF last.

            if (
                a.dnf !== b.dnf
            ) {

                return a.dnf
                    ? 1
                    : -1;

            }


            return ascending
                ? a.minutes - b.minutes
                : b.minutes - a.minutes;

        }


        // =========================================================
        // PARSE DURATION
        // =========================================================

        function parseDuration(
            time
        ) {

            if (
                !time ||
                time === "-"
            ) {

                return {
                    dnf: false,
                    minutes: Infinity
                };

            }


            if (
                !time.includes("DNF")
            ) {

                const match =
                    time.match(
                        /(\d+)h\s+(\d+)m/
                    );


                if (match) {

                    return {

                        dnf: false,

                        minutes:
                            Number(match[1]) * 60 +
                            Number(match[2])

                    };

                }

            }


            const dnfMatch =
                time.match(
                    /DNF(?:\s*\((\d+)h\s+(\d+)m\))?/
                );


            if (dnfMatch) {

                const hours =
                    dnfMatch[1]
                        ? Number(dnfMatch[1])
                        : Infinity;


                const minutes =
                    dnfMatch[2]
                        ? Number(dnfMatch[2])
                        : Infinity;


                return {

                    dnf: true,

                    minutes:
                        hours * 60 +
                        minutes

                };

            }


            return {

                dnf: true,
                minutes: Infinity

            };

        }


        // =========================================================
        // RESET SORT ARROWS
        // =========================================================

        function resetArrows() {

            document
                .querySelectorAll(".arrow")
                .forEach(
                    arrow => {

                        arrow
                            .classList
                            .remove("sorted");


                        arrow.style.transform =
                            "scale(1) rotate(0deg)";

                    }
                );

        }


        // =========================================================
        // UPDATE SORT ARROW
        // =========================================================

        function updateArrow(
            columnIndex,
            ascending
        ) {

            const headers = [

                null,

                "name-header",

                "surname-header",

                "starts-header",

                "kp1-header",

                "kp2-header",

                "kp3-header",

                "finiss-header",

                "laiks-header"

            ];


            const headerId =
                headers[columnIndex];


            if (!headerId) {
                return;
            }


            const arrow =
                document.querySelector(
                    `#${headerId} .arrow`
                );


            if (!arrow) {
                return;
            }


            arrow
                .classList
                .add("sorted");


            arrow.style.transform =
                `scale(1.5) rotate(${ascending ? 0 : 180}deg)`;

        }


        // =========================================================
        // SEARCH
        // =========================================================

        function filterTable(
            searchTerm
        ) {

            const normalizedSearchTerm =
                normalizeText(
                    searchTerm
                );


            const rows =
                document.querySelectorAll(
                    "#participants-table tbody tr"
                );


            rows.forEach(
                row => {

                    const textContent =
                        normalizeText(
                            row.textContent
                        );


                    row.style.display =
                        textContent.includes(
                            normalizedSearchTerm
                        )
                            ? ""
                            : "none";

                }
            );

        }


        function normalizeText(
            value
        ) {

            return String(value)
                .normalize("NFD")
                .replace(
                    /[\u0300-\u036f]/g,
                    ""
                )
                .toLowerCase();

        }

    </script>

</body>
